name: Cleardata
description: 'ClearDATA is healthcare''s dedicated cloud security, compliance, and operations partner,
  helping providers, payers, health-tech software companies, medical device makers, and life sciences
  organizations build and run on AWS, Microsoft Azure, and Google Cloud in a HIPAA- and HITRUST-aligned
  way. Its offering spans Cloud Security Posture Management (CSPM) with 300+ healthcare-specific
  safeguards, Managed Detection & Response (MDR), automated Cloud Compliance, and Cloud Operations,
  delivered through the CyberHealth platform and managed/professional services. ClearDATA is an AWS
  Level 1 MSSP and Microsoft Gold Partner, and maps controls to HIPAA, HITRUST, SOC 2, NIST, ISO, PCI,
  and GDPR. ClearDATA is backed by Norwest Venture Partners. This profile is maintained in the API
  Evangelist network; ClearDATA does not publish a public developer API or portal.'
